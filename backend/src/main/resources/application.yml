server:
  port: 8080

spring:
  # MySQL Configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # [TODO] 队友请确认: 数据库地址和库名 video_generation_platform 是否正确
    url: jdbc:mysql://121.43.193.225:3306/video_generation_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    # [TODO] 队友请修改: 你的本地数据库账号
    username: root
    # [TODO] 队友请修改: 你的本地数据库密码
    password: huike01
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      auto-commit: true
      idle-timeout: 30000
      pool-name: DatebookHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1


  # Redis Configuration
  data:
    redis:
      # [TODO] 队友请修改: Redis服务地址 (默认为 localhost)
      host: localhost
      port: 6379
      database: 0
      # [TODO] 队友请修改: Redis密码 (若无则留空)
      password: 

  # File Upload Configuration (Custom)
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# MyBatis Plus Configuration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto # Default, specific tables override

# Sa-Token Configuration
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: 7200
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  # [TODO] 队友请注意: 开发环境可用此Demo Key，生产环境务必修改
  jwt-secret-key: helloworld123helloworld123helloworld123 # Demo Key
  # 排除路径 (Filter鉴权排除)
  filter:
    exclude-list: /storage/**,/favicon.ico,/doc.html,/webjars/**,/v3/api-docs/**,/api/v1/callbacks/**

# Knife4j Configuration
knife4j:
  enable: true
  setting:
    language: zh-CN

# Custom File Path Config
file:
  # [TODO] 队友请修改: [重要] 必须改为你电脑上的本地绝对路径！用于存储上传的文件
  upload-path: /Users/yangli/Documents/自动化短视频创作平台/storage

# 短信服务配置 (阿里云号码认证服务)
sms:
  aliyun:
    # 短信服务总开关
    enabled: true
    
    # 阿里云访问密钥
    access-key-id: YOUR_ACCESS_KEY_ID
    access-key-secret: YOUR_ACCESS_KEY_SECRET
    
    # 短信签名 (从用户示例代码获取)
    sign-name: 速通互联验证码
    
    # 短信模板CODE
    template-code: "100001"
    
    # 阿里云服务区域ID
    region-id: cn-hangzhou

# 支付宝沙盒配置
alipay:
  sandbox: true
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  # [TODO] 请填写您的沙盒AppID
  app-id: "9021000162618270"
  # [TODO] 请填写商户应用私钥 (PKCS8 格式)
  private-key: ""
  # [TODO] 请填写支付宝公钥
  alipay-public-key: ""
  sign-type: RSA2
  # [TODO] 请填写外网穿透地址 (如 ngrok)，用于接收支付宝异步回调
  notify-url: "http://t28679d6.natappfree.cc"
  # 前端支付成功后的跳转地址
  return-url: "http://localhost:3000/payment/success"
